<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; frame-src 'self' file:; img-src 'self' data: file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vulnerable Library Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-icon" src="../assets/icon.png" alt="" width="28" height="28" />
        <div class="brand-text">
          <h1>Vuln Scanner</h1>
          <p>Library security scan</p>
        </div>
      </div>

      <div class="status-pill" id="status-pill">Idle</div>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="scan" id="tab-scan">Progress</button>
        <button type="button" class="tab" data-tab="report" id="tab-report">Report</button>
      </nav>

      <section class="side-panel">
        <h2>Options</h2>
        <div class="options-stack">
          <label class="check"><input type="checkbox" id="opt-high-only" /><span>High / Critical only</span></label>
          <label class="check"><input type="checkbox" id="opt-skip-cache" /><span>Skip caches</span></label>
          <label class="check"><input type="checkbox" id="opt-skip-osv" /><span>Skip OSV API</span></label>
        </div>
        <label class="field">
          <span>Max projects / ecosystem</span>
          <input type="number" id="opt-max" min="1" max="500" value="80" />
        </label>
        <label class="field">
          <span>Optional root folder</span>
          <div class="path-row">
            <input type="text" id="opt-path" placeholder="Leave empty for defaults" />
            <button type="button" class="btn ghost icon-btn" id="btn-pick" title="Browse">…</button>
          </div>
        </label>
      </section>

      <div class="side-actions">
        <button type="button" class="btn primary" id="btn-run">Start</button>
        <button type="button" class="btn danger" id="btn-stop" disabled>Stop</button>
        <button type="button" class="btn ghost" id="btn-reveal">Open data folder</button>
      </div>
    </aside>

    <main class="main">
      <section class="view active" id="view-scan">
        <div class="progress-card panel">
          <div class="progress-top">
            <div class="progress-copy">
              <h2 id="phase-text">Ready</h2>
              <p class="detail" id="detail-text">Configure options and start a scan.</p>
            </div>
            <div class="pct" id="pct-text">0%</div>
          </div>
          <div class="bar" aria-hidden="true">
            <div class="bar-fill" id="bar-fill"></div>
          </div>
        </div>

        <div class="split-panels">
          <div class="findings-card panel">
            <div class="panel-head">
              <h2>Found so far</h2>
              <span class="findings-count" id="findings-count">0</span>
            </div>
            <ul id="live-findings" class="live-findings"></ul>
            <p class="findings-empty" id="findings-empty">No issues found yet.</p>
          </div>

          <div class="events-card panel">
            <div class="panel-head">
              <h2>Status</h2>
              <button type="button" class="btn ghost small" id="btn-clear">Clear</button>
            </div>
            <ul id="events" class="events"></ul>
          </div>
        </div>
      </section>

      <section class="view" id="view-report">
        <div class="report-toolbar">
          <div>
            <h2>Findings report</h2>
            <p class="report-note">Stays inside the app. Export a copy when you need a file.</p>
          </div>
          <div class="report-actions">
            <div class="export-group" role="group" aria-label="Export report">
              <button type="button" class="btn ghost small" data-export="json">JSON</button>
              <button type="button" class="btn ghost small" data-export="txt">TXT</button>
              <button type="button" class="btn ghost small" data-export="csv">CSV</button>
              <button type="button" class="btn ghost small" data-export="md">Markdown</button>
              <button type="button" class="btn ghost small" data-export="html">HTML</button>
            </div>
            <button type="button" class="btn ghost small" id="btn-refresh-report">Refresh</button>
          </div>
        </div>
        <div class="report-frame-wrap panel">
          <iframe id="report-frame" title="Vulnerability report" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
          <div class="report-empty" id="report-empty">No report yet. Run a scan to see results here.</div>
        </div>
      </section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
