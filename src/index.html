<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vulnerable Library Scanner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Cross-platform scanner</p>
        <h1>Vulnerable Library Scanner</h1>
        <p class="sub" id="platform-line">Detecting platform…</p>
      </div>
      <div class="status-pill" id="status-pill">Idle</div>
    </header>

    <section class="panel">
      <h2>Scan options</h2>
      <div class="grid">
        <label class="check">
          <input type="checkbox" id="opt-high-only" />
          <span>High / Critical only</span>
        </label>
        <label class="check">
          <input type="checkbox" id="opt-skip-cache" />
          <span>Skip package caches</span>
        </label>
        <label class="check">
          <input type="checkbox" id="opt-skip-osv" />
          <span>Skip OSV API fallback</span>
        </label>
        <label class="field">
          <span>Max projects per ecosystem</span>
          <input type="number" id="opt-max" min="1" max="500" value="80" />
        </label>
        <label class="field path-field">
          <span>Optional root path / drive</span>
          <div class="path-row">
            <input type="text" id="opt-path" placeholder="e.g. C:\GeoWeb2 or /Users/you/Projects (empty = defaults)" />
            <button type="button" class="btn ghost" id="btn-pick">Browse</button>
          </div>
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="btn-start">Start scan</button>
        <button type="button" class="btn danger" id="btn-stop" disabled>Stop</button>
        <button type="button" class="btn" id="btn-open" disabled>Open HTML report</button>
        <button type="button" class="btn ghost" id="btn-reveal" disabled>Show in folder</button>
      </div>
    </section>

    <section class="panel paths">
      <h2>Paths</h2>
      <dl>
        <div><dt>Scanner script</dt><dd id="path-script">—</dd></div>
        <div><dt>HTML report</dt><dd id="path-report">—</dd></div>
        <div><dt>PowerShell</dt><dd id="path-ps">—</dd></div>
      </dl>
    </section>

    <section class="panel log-panel">
      <div class="log-head">
        <h2>Live output</h2>
        <button type="button" class="btn ghost small" id="btn-clear">Clear</button>
      </div>
      <pre id="log" class="log" aria-live="polite"></pre>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
