name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Electron bundles
        run: npm run build

      - name: Shared tests (both platforms)
        run: npm test

      - name: Windows platform suite
        if: runner.os == 'Windows'
        run: npm run test:win

      - name: macOS platform suite
        if: runner.os == 'macOS'
        run: npm run test:mac
